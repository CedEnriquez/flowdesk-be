spring.application.name=flowdesk-be
server.port=8081

# --- Database -------------------------------------------------------------------
# Credentials live in ./local.properties (git-ignored) or the SPRING_DATASOURCE_* env vars.
spring.config.import=optional:file:./local.properties

# --- JPA / Flyway --------------------------------------------------------------
# Flyway owns the schema (db/migration); Hibernate only validates it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# --- Session cookie ------------------------------------------------------------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set to true in production (HTTPS only)
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m

# --- Request size limits -------------------------------------------------------
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=64KB
server.tomcat.max-swallow-size=128KB

# --- App -----------------------------------------------------------------------
app.cors.allowed-origin=http://localhost:5173
app.seed.enabled=true
